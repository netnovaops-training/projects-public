# One Dependabot PR per repo per month: every ecosystem in one multi-ecosystem group,
# 00:00 New York on the 1st (before the 6 AM pull). Owner's rule 2026-11-19: few, large PRs.
# Made by Scratchpad tools/dependabot_one_pr.py; edit the ecosystem list here, keep the group.
version: 2
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: monthly
      time: "00:00"
      timezone: America/New_York
updates:
- package-ecosystem: cargo
  directories:
  - /tickets
  labels:
  - dependencies
  - rust
  patterns:
  - '*'
  multi-ecosystem-group: all-dependencies
- package-ecosystem: pip
  directories:
  - /jasons-site/Kitchen
  - /jasons-site/Mom
  - /jasons-site/recipe-app
  labels:
  - dependencies
  - python
  patterns:
  - '*'
  multi-ecosystem-group: all-dependencies
- package-ecosystem: docker
  directories:
  - /jasons-site/Mom
  - /tickets
  labels:
  - dependencies
  - docker
  patterns:
  - '*'
  multi-ecosystem-group: all-dependencies
- package-ecosystem: docker-compose
  directories:
  - /jasons-site/Mom
  - /jasons-site/Mom/tools
  labels:
  - dependencies
  - docker
  patterns:
  - '*'
  multi-ecosystem-group: all-dependencies
- package-ecosystem: github-actions
  directory: /
  labels:
  - dependencies
  patterns:
  - '*'
  multi-ecosystem-group: all-dependencies
