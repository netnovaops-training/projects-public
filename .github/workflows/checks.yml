# Fast checks on every push to main or tickets, and on every pull request into main.
#
#   gitleaks          secrets in the new commits (a manual run scans the whole history)
#   shellcheck        every *.sh; fails on error severity only
#   psscriptanalyzer  every *.ps1; fails on Error severity only, counts the warnings
#   actionlint        mistakes in .github/workflows
#   zizmor            security problems in the workflows themselves; fails on high severity only
#
# Private repo: results go to each run's summary page (no Security tab on the free plan).
name: checks

on:
  push:
    branches: [main, tickets]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 4 * * *' # daily: every job runs and gitleaks scans the whole history
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the new commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          range=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$BASE_SHA..$HEAD_SHA"
          elif [ "$EVENT_NAME" = "push" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$AFTER"
          fi
          echo "Scanning: ${range:-the whole history}"
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo ${range:+--log-opts "$range"} --redact --no-banner --exit-code 1

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck (the runner's copy; fails on errors only)
        run: |
          set -u
          mapfile -t files < <(git ls-files '*.sh')
          echo "${#files[@]} shell scripts, shellcheck $(shellcheck --version | sed -n 's/^version: //p')"
          rc=0
          shellcheck --severity=error "${files[@]}" || rc=$?
          warnings=$(shellcheck --severity=warning -f gcc "${files[@]}" 2>/dev/null | wc -l)
          echo "### ShellCheck: ${#files[@]} scripts, $warnings warnings (do not fail), exit $rc" >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  psscriptanalyzer:
    name: psscriptanalyzer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: PSScriptAnalyzer 1.25.0 (fails on Error severity only)
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          $files = @(git ls-files '*.ps1')
          $results = foreach ($f in $files) { Invoke-ScriptAnalyzer -Path $f -Severity Error,Warning }
          $errors = @($results | Where-Object Severity -eq 'Error')
          $warnings = @($results | Where-Object Severity -eq 'Warning')
          "### PSScriptAnalyzer 1.25.0: $($files.Count) scripts, $($errors.Count) errors, $($warnings.Count) warnings (warnings do not fail)" |
            Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          foreach ($e in $errors) { "::error file=$($e.ScriptPath),line=$($e.Line)::$($e.RuleName): $($e.Message)" }
          if ($errors.Count -gt 0) { exit 1 }

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint 1.7.12
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor 1.30.1 (fails on high severity only)
        env:
          NO_COLOR: '1'
        run: |
          set -u
          pipx run --spec zizmor==1.30.1 zizmor --offline --no-progress --format plain .github/workflows > zizmor-all.txt 2>&1 || true
          echo "### zizmor 1.30.1: $(grep -i 'finding' zizmor-all.txt | tail -1)" >> "$GITHUB_STEP_SUMMARY"
          pipx run --spec zizmor==1.30.1 zizmor --offline --no-progress --min-severity high .github/workflows
