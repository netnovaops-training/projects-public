# rust-clippy over every Rust workspace (same idea as garden-for-all): a summary on the run page
# (total, per level, the ten most common lints) and the full result as an artifact for 14 days.
# Green when clippy only has warnings; red when clippy itself breaks (code does not compile, a
# deny-level lint, or no result at all). Private repo: no Security tab upload.
name: rust-clippy analyze

on:
  push:
    branches: [main, tickets]
    paths: ['**/*.rs', '**/Cargo.toml', '**/Cargo.lock', '.github/workflows/rust-clippy.yml']
  pull_request:
    branches: [main]
  schedule:
    - cron: '39 23 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-clippy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-clippy-analyze:
    name: clippy (${{ matrix.dir }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dir: [tickets, jasons-site/ai-stack/rust]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain (rustup is already on the runner)
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          cargo clippy --version

      - name: Run rust-clippy
        working-directory: ${{ matrix.dir }}
        run: |
          rc=0
          cargo clippy --all-features --all-targets --message-format=json > clippy-results.json || rc=$?
          echo "$rc" > clippy-exit-code.txt

      - name: Summarise (warnings are fine; a broken or empty run is not)
        working-directory: ${{ matrix.dir }}
        env:
          DIR: ${{ matrix.dir }}
        run: |
          python3 - <<'PY'
          import collections, json, os, sys
          rc = int(open("clippy-exit-code.txt").read().strip())
          levels, lints, finished = collections.Counter(), collections.Counter(), []
          for line in open("clippy-results.json", encoding="utf-8"):
              try:
                  m = json.loads(line)
              except ValueError:
                  continue
              if m.get("reason") == "build-finished":
                  finished.append(bool(m.get("success")))
              elif m.get("reason") == "compiler-message":
                  msg = m["message"]
                  if msg["level"] in ("warning", "error"):
                      levels[msg["level"]] += 1
                      lints[(msg.get("code") or {}).get("code") or "(no lint name)"] += 1
          total = sum(levels.values())
          out = [f"### Clippy: {os.environ['DIR']}", "",
                 f"- total: {total} (warnings: {levels['warning']}, errors: {levels['error']})",
                 f"- cargo exit code: {rc}", "", "Ten most common lints:", ""]
          out += [f"- `{name}`: {n}" for name, n in lints.most_common(10)] or ["- none"]
          text = "\n".join(out) + "\n"
          open("clippy-summary.md", "w", encoding="utf-8").write(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(text)
          if rc != 0 or not finished or not all(finished):
              print(f"::error title=clippy::clippy itself failed (exit code {rc}, build finished: {finished})")
              sys.exit(1)
          PY

      - name: Keep the full result for 14 days
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clippy-results-${{ strategy.job-index }}
          path: |
            ${{ matrix.dir }}/clippy-results.json
            ${{ matrix.dir }}/clippy-summary.md
          retention-days: 14
          if-no-files-found: warn
