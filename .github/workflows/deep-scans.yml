# Deep scans: slower, broader checks. Pull requests into main, Sundays 03:37 UTC, and by hand.
# They report what they find on the run's summary page and do not fail on findings (only when a
# tool breaks, or for cargo-audit when a vulnerable crate shows up). Private repo: no Security tab.
name: deep-scans

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '37 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deep-scans-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep 1.181.0 (finds things, does not fail on them)
        run: |
          set -eu
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src" -w /src \
            semgrep/semgrep:1.181.0@sha256:81474464c1f07483ba0682a44787fd93c91397419762a04abe2bafaae396304b \
            semgrep scan --config p/python --config p/rust --config p/php --config p/javascript \
            --config p/dockerfile --config p/secrets --metrics=off --sarif --output semgrep.sarif --quiet
          test -s semgrep.sarif
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, collections
          runs = json.load(open("semgrep.sarif"))["runs"]
          res = [r for run in runs for r in run.get("results", [])]
          print(f"### Semgrep: {len(res)} findings")
          for rule, n in collections.Counter(r["ruleId"].split(".")[-1] for r in res).most_common(15):
              print(f"- {rule}: {n}")
          EOF

  trivy-fs:
    name: trivy (files)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trivy file-system scan (finds things, does not fail on them)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: table
          output: trivy-fs.txt
          exit-code: '0'
      - name: Summary
        run: |
          set -eu
          test -f trivy-fs.txt
          { echo "### Trivy (files), HIGH and CRITICAL"; echo '```'; head -c 60000 trivy-fs.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  osv-scanner:
    name: osv-scanner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: OSV-Scanner on every lock file (finds things, does not fail on them)
        id: osv
        continue-on-error: true # exits 1 when it finds a vulnerability; the report check below catches a crash
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --recursive
            --format=table
            --output=osv-scanner.txt
            ./
      - name: Summary
        env:
          OSV_OUTCOME: ${{ steps.osv.outcome }}
        run: |
          set -eu
          test -f osv-scanner.txt
          { echo "### OSV-Scanner (tool exit: $OSV_OUTCOME)"; echo '```'; head -c 60000 osv-scanner.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache cargo-audit
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.22.2-${{ runner.os }}
      - name: Install cargo-audit 0.22.2
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-audit --version 0.22.2
      - name: Audit every Cargo.lock against the RustSec advisory database
        # Reviewed 2026-10-25, none reachable in this code and none with a fix to take:
        #   RUSTSEC-2026-0374  basic-toml unmaintained (pulled in by askama, latest version)
        #   RUSTSEC-2023-0071  rsa timing attack on DECRYPTION; auth only signs (RS256)
        #   RUSTSEC-2026-0387  crypto-bigint timing; only in ES256/ES384 code, auth signs RS256
        # colibri's desktop app (Tauri) is reported but does not fail the job: its old crates come
        # with Tauri itself and need a Tauri upgrade, a project of its own.
        run: |
          set -u
          rc=0
          ignore=(--ignore RUSTSEC-2026-0374 --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0387)
          echo "### cargo-audit 0.22.2" >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r lock; do
            r=0
            cargo audit "${ignore[@]}" --file "$lock" > audit.txt 2>&1 || r=$?
            case "$lock" in
              */colibri/desktop/*) note="(report only)" ;;
              *) note=""; [ "$r" -ne 0 ] && rc=$r ;;
            esac
            echo "- $lock: exit $r (0 = no vulnerable crates) $note" >> "$GITHUB_STEP_SUMMARY"
            grep -E '^(Crate|ID|Title):' audit.txt | head -20 | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"
          done < <(git ls-files '*Cargo.lock')
          exit "$rc"
